name: Profile README & Stats Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/assets/**'
      - '.github/cache/**'
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/cache/requirements.txt'

      - name: Install dependencies
        run: python -m pip install -r .github/cache/requirements.txt

      - name: Update Profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || 'Juknum' }}
        run: python .github/scripts/today.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/ .github/cache/
          git diff --staged --quiet || git commit -m "chore: update profile banner stats [skip ci]"
          git push
